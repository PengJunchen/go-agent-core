name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ['1.26']
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}

      - name: Download dependencies
        run: go mod download

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test with race detection
        run: go test -race -count=1 -timeout 120s ./...

      - name: Log integrity tests
        run: go test -race -count=1 -run "TestLog" ./memory/log/...

      - name: Goroutine leak detection
        run: go test -race -count=1 -run "TestInterrupt|TestClose" ./agent/loop/...

      - name: AST scan
        run: go run ./verify/cmd/scanner -dir .
